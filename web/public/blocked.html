<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>福利站 · 这条路暂时走不通</title>
    <style>
      :root {
        --clover-100: #dcf1e2;
        --clover-300: #8fd6a8;
        --clover-400: #5bbc82;
        --clover-500: #35a465;
        --clover-600: #268552;
        --clover-700: #1f6a44;
        --clover-ink: #1c4a32;
        --gold-400: #ddb45f;
        --gold-500: #c9963a;
        --cream: #faf6e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        color: var(--clover-ink);
        font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
        background:
          radial-gradient(1100px 640px at 8% -4%, rgba(143, 214, 168, 0.5), transparent 60%),
          radial-gradient(900px 560px at 96% 4%, rgba(238, 217, 164, 0.5), transparent 58%),
          radial-gradient(760px 640px at 88% 88%, rgba(188, 227, 201, 0.35), transparent 60%),
          linear-gradient(160deg, #eef7ee 0%, #f4f8ec 46%, #f8f4e4 100%);
        background-attachment: fixed;
      }

      ::selection {
        background: rgba(91, 188, 130, 0.35);
      }

      .card {
        width: 100%;
        max-width: 520px;
        padding: 40px 28px 28px;
        text-align: center;
        border-radius: 2rem;
        border: 1px solid var(--clover-100);
        background: rgba(255, 255, 255, 0.85);
        box-shadow:
          0 8px 32px -14px rgba(31, 106, 68, 0.18),
          0 2px 8px -4px rgba(31, 106, 68, 0.08);
      }

      .emblem {
        position: relative;
        width: 118px;
        height: 118px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .emblem .ring {
        position: absolute;
        inset: 0;
        border: 2px dashed rgba(53, 164, 101, 0.5);
        border-radius: 50%;
      }
      .emblem .disc {
        position: absolute;
        inset: 9%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 4px 16px -6px rgba(38, 133, 82, 0.22);
      }
      .emblem svg {
        position: relative;
        animation: sway 3.2s ease-in-out infinite;
        transform-origin: 50% 50%;
      }

      @keyframes sway {
        0%,
        100% {
          transform: rotate(-8deg);
        }
        50% {
          transform: rotate(8deg);
        }
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.4;
        letter-spacing: 0.04em;
        color: var(--clover-ink);
      }

      .lead {
        margin: 0 0 22px;
        font-size: 15px;
        line-height: 1.85;
        color: rgba(31, 106, 68, 0.85);
      }

      .tips {
        margin: 0 0 24px;
        padding: 16px 18px;
        text-align: left;
        list-style: none;
        border-radius: 1.25rem;
        background: var(--cream);
        border: 1px solid rgba(221, 180, 95, 0.28);
      }
      .tips li {
        position: relative;
        padding-left: 22px;
        font-size: 14px;
        line-height: 1.9;
        color: rgba(28, 74, 50, 0.9);
      }
      .tips li + li {
        margin-top: 6px;
      }
      .tips li::before {
        content: '';
        position: absolute;
        left: 6px;
        top: 12px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--clover-400);
      }

      .btn {
        display: inline-block;
        padding: 13px 34px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        color: #fff;
        background: linear-gradient(135deg, #35a465 0%, #268552 100%);
        box-shadow: 0 10px 34px -12px rgba(38, 133, 82, 0.28);
      }
      .btn:hover {
        filter: brightness(1.05);
      }

      .slogan {
        margin: 20px 0 0;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: rgba(31, 106, 68, 0.7);
      }
      .slogan .gold {
        color: var(--gold-500);
        font-weight: 600;
      }

      .cf {
        margin: 26px 0 0;
        padding-top: 16px;
        border-top: 1px dashed var(--clover-100);
        font-size: 11px;
        line-height: 1.7;
        color: rgba(31, 106, 68, 0.45);
        word-break: break-all;
      }

      @media (max-width: 400px) {
        .card {
          padding: 30px 20px 22px;
          border-radius: 1.5rem;
        }
        .emblem {
          width: 96px;
          height: 96px;
        }
        h1 {
          font-size: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .emblem svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="emblem">
        <span class="ring"></span>
        <span class="disc"></span>
        <svg width="68" height="68" viewBox="-24 -24 48 52" fill="none" aria-hidden="true">
          <path
            d="M1.5 6 C2.5 14 6 20 10 24"
            stroke="#268552"
            stroke-width="2.6"
            stroke-linecap="round"
            fill="none"
          />
          <g transform="rotate(0) translate(0 -10.5)">
            <path
              d="M0,-4 C-1.2,-9.5 -6.5,-11.5 -9.5,-8.5 C-12.5,-5.5 -11,-1.5 -6,1.5 C-3.5,3 -1,3.5 0,3.8 C1,3.5 3.5,3 6,1.5 C11,-1.5 12.5,-5.5 9.5,-8.5 C6.5,-11.5 1.2,-9.5 0,-4 Z"
              fill="#35a465"
            />
          </g>
          <g transform="rotate(90) translate(0 -10.5)">
            <path
              d="M0,-4 C-1.2,-9.5 -6.5,-11.5 -9.5,-8.5 C-12.5,-5.5 -11,-1.5 -6,1.5 C-3.5,3 -1,3.5 0,3.8 C1,3.5 3.5,3 6,1.5 C11,-1.5 12.5,-5.5 9.5,-8.5 C6.5,-11.5 1.2,-9.5 0,-4 Z"
              fill="#5bbc82"
            />
          </g>
          <g transform="rotate(180) translate(0 -10.5)">
            <path
              d="M0,-4 C-1.2,-9.5 -6.5,-11.5 -9.5,-8.5 C-12.5,-5.5 -11,-1.5 -6,1.5 C-3.5,3 -1,3.5 0,3.8 C1,3.5 3.5,3 6,1.5 C11,-1.5 12.5,-5.5 9.5,-8.5 C6.5,-11.5 1.2,-9.5 0,-4 Z"
              fill="#35a465"
            />
          </g>
          <g transform="rotate(270) translate(0 -10.5)">
            <path
              d="M0,-4 C-1.2,-9.5 -6.5,-11.5 -9.5,-8.5 C-12.5,-5.5 -11,-1.5 -6,1.5 C-3.5,3 -1,3.5 0,3.8 C1,3.5 3.5,3 6,1.5 C11,-1.5 12.5,-5.5 9.5,-8.5 C6.5,-11.5 1.2,-9.5 0,-4 Z"
              fill="#5bbc82"
            />
          </g>
          <circle cx="0" cy="0" r="1.6" fill="#1f6a44" />
        </svg>
      </div>

      <h1>这片叶子暂时够不着</h1>

      <p class="lead">
        福利站目前没有对中国大陆网络开放直连,<br />
        所以这次访问被挡在了门外。<br />
        不是你的问题,换条路就能进来。
      </p>

      <ul class="tips">
        <li>开启你惯用的代理后重新访问本站。</li>
        <li>或换用一个非中国大陆的网络环境再打开。</li>
        <li>连上之后刷新页面,签到与福利都照常。</li>
      </ul>

      <a class="btn" href="https://fuli.lucky0625.qzz.io/">重新试试</a>

      <p class="slogan">摘叶子,攒好运 · 今天也要 <span class="gold">lucky</span> 一点</p>

      <p class="cf">
        Cloudflare 提示:<br />
        ::CLOUDFLARE_ERROR_DESCRIPTION::
      </p>
    </main>
  </body>
</html>
