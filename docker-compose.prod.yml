# 福利站 生产部署 compose(服务器上使用)。
#
# 与根目录 docker-compose.yml 的区别:这份**不构建**,直接拉 GitHub Actions
# 推到 GHCR 的镜像。CI 会把本文件同步到服务器的部署目录,然后执行
# `docker compose pull && docker compose up -d`。
#
# 服务器上需要自备(都不进 git):
#   1. .env —— 与本文件同目录,内容参照仓库 .env.example
#   2. 可达的 MySQL 与 new-api 实例
#
# 镜像 tag 由 CI 写进 .env 的 WELFARE_IMAGE;未设置时回落 :main。

services:
  welfare:
    image: ${WELFARE_IMAGE:-ghcr.io/0401lucky/welfare-station:main}
    container_name: welfare-station
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # 只绑本机回环,由 cloudflared 隧道对外提供 HTTPS。
      # 宿主机 8080 已被其他服务(caddy)占用,这里用 8090;隧道
      # fuli.lucky0625.qzz.io -> http://localhost:8090 依赖这个端口,别改。
      - "127.0.0.1:8090:8080"
    healthcheck:
      # 站点信息是公开只读接口,不需要鉴权,适合做存活探针。
      # 镜像基于 alpine,自带 wget(busybox);没有 curl。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/site/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      # 不限制的话 json 日志会把磁盘写满,这是长跑容器最常见的运维事故。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # new-api 与 MySQL 都在 newapi_default 网络里,必须接进去才能用容器名
    # (newapi9-new-api / newapi9-mysql)访问它们。
    networks:
      - newapi_default

networks:
  newapi_default:
    external: true
